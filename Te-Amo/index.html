<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto; 
            background-color: #000 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            scroll-behavior: smooth;
        }
        /* Contenedor de la galaxia a pantalla completa */
        .galaxy-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Indicador de scroll animado */
        .scroll-indicator {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            animation: bounce 2s infinite;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -10px); }
            60% { transform: translate(-50%, -5px); }
        }
        
        /* Contenedor para los botones de música flotantes */
        .music-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        /* Botones flotantes de música */
        .music-button {
            padding: 10px 20px;
            background: linear-gradient(45deg, #ff007f, #ff40a0);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.2s, background 0.3s;
            font-size: 0.85rem;
        }
        .music-button:hover { transform: scale(1.05); }
        .music-button.active { background: #333; box-shadow: none; }

        /* --- SECCIÓN DE LA GALERÍA --- */
        .gallery-section {
            padding: 80px 20px;
            background: linear-gradient(to bottom, #000000, #1a000a);
            text-align: center;
        }
        .gallery-section h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #ff40a0;
            text-shadow: 0 0 10px rgba(255, 64, 160, 0.5);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s, border-color 0.3s;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #ff007f;
        }
        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .photo-desc {
            padding: 15px;
            font-size: 1rem;
            color: #ddd;
            background-color: #151515;
        }
    </style>
</head>
<body>

    <audio id="music1" src="musica1.mp3" loop></audio>
    <audio id="music2" src="musica2.mp3" loop></audio>

    <div class="music-controls">
        <button id="btnMusic1" class="music-button">🎵 Canción 1</button>
        <button id="btnMusic2" class="music-button">🎵 Canción 2</button>
    </div>

    <div class="galaxy-container">
        <canvas id="galaxyCanvas"></canvas>
        <div class="scroll-indicator">Desliza hacia abajo para ver nuestra galería ↓</div>
    </div>

    <section class="gallery-section">
        <h2>Nuestros Momentos Juntos ✨</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="img-1.jpeg" alt="Momento 1">
            </div>
            <div class="gallery-item">
                <img src="img-2.jpeg" alt="Momento 2">
            </div>
            <div class="gallery-item">
                <img src="img-3.jpeg" alt="Momento 3">
            </div>
            <div class="gallery-item">

                <img src="img-4.jpeg" alt="Momento 4">
                
            </div>

            <div class="gallery-item">
                <img src="img-5.jpeg" alt="Momento 5">
            
            </div>

            <div class="gallery-item">
                <img src="img-6.jpeg" alt="Momento 6">
            
            </div>

            <div class="gallery-item">
                <img src="img-7.jpeg" alt="Momento 7">
                
            </div>

            <div class="gallery-item">
                <img src="img-8.jpeg" alt="Momento 8">
               
            </div>

            <div class="gallery-item">
                <img src="img-9.jpeg" alt="Momento 9">
                
            </div>

            <div class="gallery-item">
                <img src="img-10.jpeg" alt="Momento 10">
                
            </div>

            <div class="gallery-item">
                <img src="img-11.jpeg" alt="Momento 11">
                
            </div>

            <div class="gallery-item">
                <img src="img-12.jpeg" alt="Momento 12">
               
            </div>

            <div class="gallery-item">
                <img src="img-13.jpeg" alt="Momento 13">
                
            </div>
                </div>
            </div> 
        </div>
    </section>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Sistema inteligente para controlar dos canciones sin que se mezclen
        const track1 = document.getElementById('music1');
        const track2 = document.getElementById('music2');
        const btn1 = document.getElementById('btnMusic1');
        const btn2 = document.getElementById('btnMusic2');

        function stopAllMusic() {
            track1.pause();
            track2.pause();
            btn1.textContent = "🎵 Canción 1";
            btn2.textContent = "🎵 Canción 2";
            btn1.classList.remove('active');
            btn2.classList.remove('active');
            btn1.style.background = "linear-gradient(45deg, #ff007f, #ff40a0)";
            btn2.style.background = "linear-gradient(45deg, #ff007f, #ff40a0)";
        }

        btn1.addEventListener('click', () => {
            if (track1.paused) {
                stopAllMusic();
                track1.play().catch(e => console.log("Bloqueo de audio"));
                btn1.textContent = "⏸️ Pausar Pista 1";
                btn1.classList.add('active');
                btn1.style.background = "#333";
            } else {
                stopAllMusic();
            }
        });

        btn2.addEventListener('click', () => {
            if (track2.paused) {
                stopAllMusic();
                track2.play().catch(e => console.log("Bloqueo de audio"));
                btn2.textContent = "⏸️ Pausar Pista 2";
                btn2.classList.add('active');
                btn2.style.background = "#333";
            } else {
                stopAllMusic();
            }
        });

        // Datos de planetas
        const planetData = [
            { text: "Te Amo", color: "#ff007f" },
            { text: "Mi Amor", color: "#ff40a0" },
            { text: "Me Encantas", color: "#ff73b9" },
            { text: "Amor de mi vida", color: "#ff0055" },
            { text: "Siempre Juntos", color: "#e6006f" },
            { text: "I Love You", color: "#ffb3d1" }
        ];

        const stars = [];
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: 0.005 + Math.random() * 0.01
            });
        }

        class Planet {
            constructor(text, color, orbitRadius, speed, angle) {
                this.text = text;
                this.color = color;
                this.orbitRadius = orbitRadius;
                this.speed = speed;
                this.angle = angle;
                this.size = 42;
            }
            update() { 
                this.angle += this.speed; 
            }
            draw() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const x = centerX + Math.cos(this.angle) * this.orbitRadius;
                const y = centerY + Math.sin(this.angle) * this.orbitRadius;

                ctx.beginPath();
                ctx.arc(centerX, centerY, this.orbitRadius, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                ctx.stroke();

                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = "#fff";
                ctx.font = "18px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("❤️", x, y);

                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(this.text, x, y + this.size + 18);
            }
        }

        const planets = planetData.map((data, index) => {
            const orbitRadius = 110 + index * 55;
            const speed = 0.0006 + (0.0003 * (planetData.length - index)); 
            const startingAngle = (index * (Math.PI * 2)) / planetData.length;
            return new Planet(data.text, data.color, orbitRadius, speed, startingAngle);
        });

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.save();
            ctx.shadowBlur = 40;
            ctx.shadowColor = "#ffcc00";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fillStyle = "#ffcc00";
            ctx.fill();
            ctx.restore();

            planets.forEach(planet => {
                planet.update();
                planet.draw();
            });

            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
